<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀 투표</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(1rem, 5vw, 3rem);
      background: #f5f4f0;
      color: #1a1917;
      font: 1rem/1.55 'Noto Sans KR', sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; }
    h1 { margin: 0.4rem 0 0.35rem; font-size: clamp(1.8rem, 5vw, 2.4rem); }
    header p { margin: 0 0 1.5rem; color: #59564e; }
    form {
      padding: clamp(1rem, 4vw, 1.75rem);
      background: #fff;
      border: 1px solid #e2e0d8;
      border-radius: 14px;
    }
    fieldset { min-inline-size: 0; padding: 0; margin: 0; border: 0; }
    legend { padding: 0; margin-bottom: 0.75rem; font-weight: 700; }
    #teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
    label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 3.2rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid #d7d4ca;
      border-radius: 10px;
      cursor: pointer;
    }
    label:has(input:checked) { border-color: #2d5a3d; background: #edf4ef; }
    label:has(input:disabled) { cursor: default; }
    label:has(input:disabled:not(:checked)) { color: #59564e; background: #f7f6f2; }
    input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: #2d5a3d; }
    .footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.25rem; }
    output { color: #59564e; }
    button {
      padding: 0.6rem 1rem;
      border: 1px solid #2d5a3d;
      border-radius: 10px;
      background: #2d5a3d;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { border-color: #e2e0d8; background: #eeece6; color: #59564e; cursor: default; }
    #retry { background: #fff; color: #2d5a3d; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid #2d5a3d; outline-offset: 3px; }
    #status { margin: 0.85rem 0 0; color: #2d5a3d; font-size: 0.9rem; }
    #status[data-error="true"] { color: #8b2020; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>팀 투표</h1>
      <p>투표할 팀을 최대 2팀 선택해 주세요. 제출한 뒤에도 선택을 바꿀 수 있습니다.</p>
    </header>

    <form id="ballot-form">
      <fieldset id="choices" disabled>
        <legend>팀 선택</legend>
        <div id="teams"></div>
      </fieldset>

      <div class="footer">
        <output id="selection-count" aria-live="polite">0 / 2팀 선택</output>
        <button id="submit" type="submit" disabled>투표 제출</button>
        <button id="revote" type="button" hidden>재투표하기</button>
        <button id="retry" type="button" hidden>다시 연결</button>
      </div>
      <p id="status" role="status">투표 서버에 연결하는 중입니다.</p>
      <noscript>투표하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
    </form>
  </main>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyBjnxtIvqa2Dodggaw3se7TzdF97yYad5E",
      authDomain: "teamvote-34e70.firebaseapp.com",
      databaseURL: "https://teamvote-34e70-default-rtdb.firebaseio.com",
      projectId: "teamvote-34e70",
      storageBucket: "teamvote-34e70.firebasestorage.app",
      messagingSenderId: "638362284614",
      appId: "1:638362284614:web:3285e18d3349f5e0fc1047",
      measurementId: "G-93GXDH57XT"
    };

    const teams = new Map([
      ["ga", "가 팀"], ["na", "나 팀"], ["da", "다 팀"], ["ra", "라 팀"],
      ["ma", "마 팀"], ["ba", "바 팀"], ["sa", "사 팀"], ["a", "아 팀"],
      ["ja", "자 팀"], ["cha", "차 팀"]
    ]);
    const maxSelections = 2;
    const ballotsPath = "anonymousTeamVote/v1/ballots";
    const sdkBase = "https://www.gstatic.com/firebasejs/10.12.0/";

    const form = document.querySelector("#ballot-form");
    const choices = document.querySelector("#choices");
    const teamList = document.querySelector("#teams");
    const count = document.querySelector("#selection-count");
    const submit = document.querySelector("#submit");
    const revote = document.querySelector("#revote");
    const retry = document.querySelector("#retry");
    const status = document.querySelector("#status");
    const inputs = new Map();

    let connection;
    let savedBallot = null;
    let editing = true;
    let pending = false;

    for (const [id, labelText] of teams) {
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = id;

      const label = document.createElement("label");
      label.append(input, labelText);
      teamList.append(label);
      inputs.set(id, input);
    }

    function selectedTeams() {
      return [...inputs].filter(([, input]) => input.checked).map(([id]) => id);
    }

    function updateControls() {
      const selection = selectedTeams();
      const locked = !connection || pending || !editing;
      choices.disabled = locked;
      submit.disabled = locked || selection.length === 0 || selection.length > maxSelections;
      submit.hidden = !editing;
      revote.hidden = !savedBallot || editing;
      count.value = selection.length + " / " + maxSelections + "팀 선택";

      for (const [id, input] of inputs) {
        input.disabled = selection.length >= maxSelections && !selection.includes(id);
      }
    }

    function showStatus(message, error = false) {
      status.textContent = message;
      status.dataset.error = String(error);
    }

    function showBallot(ballot, message = "투표가 완료됐습니다.", error = false) {
      const picks = [ballot.first, ballot.second].filter(id => teams.has(id));
      for (const [id, input] of inputs) input.checked = picks.includes(id);
      savedBallot = ballot;
      editing = false;
      showStatus(message + " 선택한 팀  " + picks.map(id => teams.get(id)).join(", "), error);
      updateControls();
    }

    async function connect() {
      retry.hidden = true;
      showStatus("투표 서버에 연결하는 중입니다.");

      try {
        const [appSdk, authSdk, dbSdk] = await Promise.all([
          import(sdkBase + "firebase-app.js"),
          import(sdkBase + "firebase-auth.js"),
          import(sdkBase + "firebase-database.js")
        ]);
        const app = appSdk.getApps().length ? appSdk.getApp() : appSdk.initializeApp(firebaseConfig);
        const auth = authSdk.getAuth(app);
        await auth.authStateReady();
        await authSdk.setPersistence(auth, authSdk.browserLocalPersistence);
        const user = auth.currentUser?.isAnonymous
          ? auth.currentUser
          : (await authSdk.signInAnonymously(auth)).user;
        const ballotRef = dbSdk.ref(dbSdk.getDatabase(app), ballotsPath + "/" + user.uid);
        const snapshot = await dbSdk.get(ballotRef);

        connection = { ballotRef, get: dbSdk.get, runTransaction: dbSdk.runTransaction };
        if (snapshot.exists()) {
          showBallot(snapshot.val());
        } else {
          showStatus("");
        }
      } catch (error) {
        const disabledAuth = error.code === "auth/operation-not-allowed" || error.code === "auth/admin-restricted-operation";
        showStatus(disabledAuth ? "익명 투표가 아직 활성화되지 않았습니다." : "투표 서버에 연결하지 못했습니다.", true);
        retry.hidden = false;
      }
      updateControls();
    }

    choices.addEventListener("change", updateControls);
    retry.addEventListener("click", connect);
    revote.addEventListener("click", () => {
      if (!connection || pending || !savedBallot) return;
      editing = true;
      showStatus("새로 제출하면 이전 선택이 바뀝니다.");
      updateControls();
      [...inputs.values()].find(input => input.checked)?.focus();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!connection || pending || !editing) return;
      const [first, second, extra] = selectedTeams();
      if (!first || extra) return;

      pending = true;
      updateControls();
      showStatus("투표를 제출하는 중입니다.");

      const ballot = second ? { first, second } : { first };
      try {
        const result = await connection.runTransaction(
          connection.ballotRef,
          () => ballot,
          { applyLocally: false }
        );
        if (result.snapshot.exists()) {
          showBallot(result.snapshot.val());
        } else {
          showStatus("투표가 저장되지 않았습니다. 다시 시도해 주세요.", true);
        }
      } catch {
        const existing = await connection.get(connection.ballotRef).catch(() => null);
        if (existing?.exists()) {
          const stored = existing.val();
          const matches = stored.first === ballot.first && stored.second === ballot.second;
          if (matches) {
            showBallot(stored);
          } else {
            showBallot(stored, "변경사항을 저장하지 못했습니다. 기존 표가 유지됩니다.", true);
          }
        } else {
          showStatus("투표가 저장됐는지 확인하지 못했습니다. 다시 시도해 주세요.", true);
        }
      } finally {
        pending = false;
        updateControls();
      }
    });

    connect();
  </script>
</body>
</html>
